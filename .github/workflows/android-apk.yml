name: Build REA Android workspace shell (prototype)

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_run:
    workflows: ["Build app-private Android Node runtime"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the removed legacy `tools` package.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Type-check the Android application
        working-directory: mobile
        run: npm run typecheck

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Download verified Node runtime candidate
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: rea-node24-android-arm64-candidate
          path: ${{ runner.temp }}/rea-runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Bundle app-private Node runtime assets
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp "${{ runner.temp }}/rea-runtime/node-runtime-arm64.tar.gz" mobile/android/app/src/main/assets/rea-runtime-arm64.tar.gz
          cp "${{ runner.temp }}/rea-runtime/node-runtime-arm64.sha256" mobile/android/app/src/main/assets/rea-runtime-arm64.sha256
          sha256sum --check mobile/android/app/src/main/assets/rea-runtime-arm64.sha256

      - name: Build installable debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rea-android-workspace-shell-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
