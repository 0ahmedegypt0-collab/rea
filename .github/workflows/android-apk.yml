name: Build REA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - "scripts/android/ensure-expo-settings.mjs"
      - ".github/workflows/android-apk.yml"
  workflow_run:
    workflows: ["Real Termux browser verification"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug-apk:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action defaults to the removed legacy `tools` package.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Type-check the Android application
        working-directory: mobile
        run: npm run typecheck

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Ensure Expo SDK 54 native module autolinking
        run: node scripts/android/ensure-expo-settings.mjs mobile/android/settings.gradle

      - name: Download verified standalone runtime and engine assets
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rea-android-engine-assets
          path: ${{ runner.temp }}/rea-runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Bundle app-private runtime and toolchain assets
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp "${{ runner.temp }}/rea-runtime/rea-runtime-arm64.tar.gz" mobile/android/app/src/main/assets/rea-runtime-arm64.tar.gz
          cp "${{ runner.temp }}/rea-runtime/rea-runtime-arm64.sha256" mobile/android/app/src/main/assets/rea-runtime-arm64.sha256
          cp "${{ runner.temp }}/rea-runtime/toolchain-manifest.json" mobile/android/app/src/main/assets/toolchain-manifest.json
          cp "${{ runner.temp }}/rea-runtime/rea-tools-packages.txt" mobile/android/app/src/main/assets/rea-tools-packages.txt
          cp "${{ runner.temp }}/rea-runtime/termux-exec-libraries.txt" mobile/android/app/src/main/assets/termux-exec-libraries.txt
          cp "${{ runner.temp }}/rea-runtime/rea-engine-js.tar.gz" mobile/android/app/src/main/assets/rea-engine-js.tar.gz
          cp "${{ runner.temp }}/rea-runtime/rea-engine-js.sha256" mobile/android/app/src/main/assets/rea-engine-js.sha256
          cp "${{ runner.temp }}/rea-runtime/android-engine-manifest.json" mobile/android/app/src/main/assets/android-engine-manifest.json
          cp "${{ runner.temp }}/rea-runtime/native-addons.txt" mobile/android/app/src/main/assets/native-addons.txt
          cp "${{ runner.temp }}/rea-runtime/native-addons-excluded.txt" mobile/android/app/src/main/assets/native-addons-excluded.txt
          (cd mobile/android/app/src/main/assets && sha256sum --check rea-runtime-arm64.sha256 && sha256sum --check rea-engine-js.sha256)

      - name: Build installable debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.event_name == 'workflow_run' && 'rea-android-standalone-debug-apk' || 'rea-android-workspace-shell-debug-apk' }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  arm64-runtime-smoke:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    needs: android-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download standalone APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rea-android-standalone-debug-apk
          path: dist

      - name: Install and launch on an ARM64 Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: arm64-v8a
          target: google_apis
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            apk="$(find dist -type f -name '*.apk' | head -n 1)"
            test -n "$apk"
            adb install "$apk"
            adb logcat -c
            adb shell monkey -p tools.rea.mobile 1
            ready=false
            for attempt in $(seq 1 450); do
              logs="$(adb logcat -d -s REA_RUNTIME:V)"
              if grep -Eq "MCP_READY toolCount=[1-9][0-9]*" <<<"$logs" && grep -q "MCP_TOOL_CALL_READY name=inspect_analysis_settings" <<<"$logs"; then
                ready=true
                break
              fi
              if grep -Eq "MCP_START_FAILED|MCP_TOOL_CALL_FAILED|NODE_START_FAILED|NODE_VERSION_FAILED|NODE_VERSION_TIMEOUT" <<<"$logs"; then
                printf '%s\n' "$logs"
                exit 1
              fi
              sleep 2
            done
            logs="$(adb logcat -d -s REA_RUNTIME:V)"
            printf '%s\n' "$logs"
            test "$ready" = true
            grep -q "NODE_READY" <<<"$logs"
            grep -Eq "MCP_READY toolCount=[1-9][0-9]*" <<<"$logs"
            grep -q "MCP_TOOL_CALL_READY name=inspect_analysis_settings" <<<"$logs"
            adb shell run-as tools.rea.mobile test -f files/usr/lib/libtermux-exec-ld-preload.so
            adb shell run-as tools.rea.mobile test -x files/usr/bin/node
            adb shell run-as tools.rea.mobile test -f files/rea-engine/scripts/rea.mjs
            adb shell run-as tools.rea.mobile test -x files/usr/bin/jadx
            adb shell run-as tools.rea.mobile test -x files/usr/bin/apktool
            adb shell run-as tools.rea.mobile test -x files/usr/bin/rizin
            adb shell run-as tools.rea.mobile test -x files/usr/bin/radare2
            adb shell run-as tools.rea.mobile test -x files/usr/bin/wasmtime
            adb shell run-as tools.rea.mobile test -x files/usr/bin/wasm-objdump
            adb shell run-as tools.rea.mobile test -x files/usr/bin/wasm2wat
            adb shell run-as tools.rea.mobile test -x files/usr/bin/wat2wasm
            adb shell run-as tools.rea.mobile test -x files/usr/bin/wasm-validate
            adb shell run-as tools.rea.mobile test -x files/usr/bin/strace
            adb shell run-as tools.rea.mobile test -x files/usr/bin/ltrace
            adb shell run-as tools.rea.mobile test -x files/usr/bin/yara
            adb shell run-as tools.rea.mobile test -x files/usr/bin/mmls
            adb shell run-as tools.rea.mobile test -x files/usr/bin/fls
            adb shell run-as tools.rea.mobile test -x files/usr/bin/icat
            adb shell run-as tools.rea.mobile test -x files/usr/bin/fsstat
            adb shell run-as tools.rea.mobile test -x files/usr/bin/tsk_recover
            adb shell run-as tools.rea.mobile test -x files/usr/bin/gdb
            adb shell run-as tools.rea.mobile test -x files/usr/bin/binwalk
            adb shell run-as tools.rea.mobile test -x files/usr/bin/apksigner
            adb shell run-as tools.rea.mobile test -x files/usr/bin/aapt2
            adb shell run-as tools.rea.mobile test -x files/usr/bin/d8
            adb shell run-as tools.rea.mobile test -x files/usr/bin/r8
            adb shell run-as tools.rea.mobile test -x files/usr/bin/adb
            adb shell run-as tools.rea.mobile test -x files/usr/bin/python
            adb shell run-as tools.rea.mobile sh -c '
              set -e
              PREFIX=/data/data/tools.rea.mobile/files/usr
              export PREFIX TERMUX_PREFIX="$PREFIX"
              export HOME=/data/data/tools.rea.mobile/files/home
              export TMPDIR=/data/data/tools.rea.mobile/files/tmp
              export PATH="$PREFIX/bin:/system/bin:/system/xbin"
              export LD_LIBRARY_PATH="$PREFIX/lib"
              export LD_PRELOAD="$PREFIX/lib/libtermux-exec-ld-preload.so"
              export JAVA_HOME="$PREFIX/lib/jvm/java-21-openjdk"
              mkdir -p "$HOME" "$TMPDIR"
              "$PREFIX/bin/bash" --version >/dev/null
              "$PREFIX/bin/python" --version >/dev/null
              "$PREFIX/bin/git" --version >/dev/null
              "$PREFIX/bin/jq" --version >/dev/null
              "$PREFIX/bin/readelf" --version >/dev/null
              "$PREFIX/bin/adb" version >/dev/null
              "$PREFIX/bin/jadx" --version >/dev/null
              "$PREFIX/bin/apktool" --version >/dev/null
              "$PREFIX/bin/apksigner" version >/dev/null
              "$PREFIX/bin/aapt2" version >/dev/null
              "$PREFIX/bin/binwalk" --version >/dev/null
              "$PREFIX/bin/gdb" --version >/dev/null
              "$PREFIX/bin/rizin" -v >/dev/null
              "$PREFIX/bin/radare2" -v >/dev/null
              "$PREFIX/bin/wasmtime" --version >/dev/null
              "$PREFIX/bin/wasm-objdump" --version >/dev/null
              "$PREFIX/bin/wasm2wat" --version >/dev/null
              "$PREFIX/bin/wat2wasm" --version >/dev/null
              "$PREFIX/bin/wasm-validate" --version >/dev/null
              "$PREFIX/bin/strace" -V >/dev/null
              "$PREFIX/bin/ltrace" -V >/dev/null
              "$PREFIX/bin/yara" --version >/dev/null
              "$PREFIX/bin/mmls" -V >/dev/null
              "$PREFIX/bin/fls" -V >/dev/null
              "$PREFIX/bin/icat" -V >/dev/null
              "$PREFIX/bin/fsstat" -V >/dev/null
              "$PREFIX/bin/tsk_recover" -V >/dev/null
            '
