name: Build REA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_run:
    workflows: ["Real Termux browser verification"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the removed legacy `tools` package.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Type-check the Android application
        working-directory: mobile
        run: npm run typecheck

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Download verified standalone runtime and engine assets
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: rea-android-engine-assets
          path: ${{ runner.temp }}/rea-runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Bundle app-private runtime and toolchain assets
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp "${{ runner.temp }}/rea-runtime/rea-runtime-arm64.tar.gz" mobile/android/app/src/main/assets/rea-runtime-arm64.tar.gz
          cp "${{ runner.temp }}/rea-runtime/rea-runtime-arm64.sha256" mobile/android/app/src/main/assets/rea-runtime-arm64.sha256
          cp "${{ runner.temp }}/rea-runtime/toolchain-manifest.json" mobile/android/app/src/main/assets/toolchain-manifest.json
          cp "${{ runner.temp }}/rea-runtime/rea-tools-packages.txt" mobile/android/app/src/main/assets/rea-tools-packages.txt
          cp "${{ runner.temp }}/rea-runtime/termux-exec-libraries.txt" mobile/android/app/src/main/assets/termux-exec-libraries.txt
          cp "${{ runner.temp }}/rea-runtime/rea-engine-js.tar.gz" mobile/android/app/src/main/assets/rea-engine-js.tar.gz
          cp "${{ runner.temp }}/rea-runtime/rea-engine-js.sha256" mobile/android/app/src/main/assets/rea-engine-js.sha256
          cp "${{ runner.temp }}/rea-runtime/android-engine-manifest.json" mobile/android/app/src/main/assets/android-engine-manifest.json
          cp "${{ runner.temp }}/rea-runtime/native-addons.txt" mobile/android/app/src/main/assets/native-addons.txt
          cp "${{ runner.temp }}/rea-runtime/native-addons-excluded.txt" mobile/android/app/src/main/assets/native-addons-excluded.txt
          (cd mobile/android/app/src/main/assets && sha256sum --check rea-runtime-arm64.sha256 && sha256sum --check rea-engine-js.sha256)

      - name: Build installable debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_run' && 'rea-android-standalone-debug-apk' || 'rea-android-workspace-shell-debug-apk' }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  arm64-runtime-smoke:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    needs: android-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download standalone APK
        uses: actions/download-artifact@v4
        with:
          name: rea-android-standalone-debug-apk
          path: dist

      - name: Install and launch on an ARM64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: arm64-v8a
          target: google_apis
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            apk="$(find dist -type f -name '*.apk' | head -n 1)"
            test -n "$apk"
            adb install "$apk"
            adb logcat -c
            adb shell monkey -p tools.rea.mobile 1
            ready=false
            for attempt in $(seq 1 450); do
              logs="$(adb logcat -d -s REA_RUNTIME:V)"
              if grep -Eq "MCP_READY toolCount=[1-9][0-9]*" <<<"$logs" && grep -q "MCP_TOOL_CALL_READY name=inspect_analysis_settings" <<<"$logs"; then
                ready=true
                break
              fi
              if grep -Eq "MCP_START_FAILED|MCP_TOOL_CALL_FAILED|NODE_START_FAILED|NODE_VERSION_FAILED|NODE_VERSION_TIMEOUT" <<<"$logs"; then
                printf '%s\n' "$logs"
                exit 1
              fi
              sleep 2
            done
            logs="$(adb logcat -d -s REA_RUNTIME:V)"
            printf '%s\n' "$logs"
            test "$ready" = true
            grep -q "NODE_READY" <<<"$logs"
            grep -Eq "MCP_READY toolCount=[1-9][0-9]*" <<<"$logs"
            grep -q "MCP_TOOL_CALL_READY name=inspect_analysis_settings" <<<"$logs"
            adb shell run-as tools.rea.mobile test -x files/usr/bin/node
            adb shell run-as tools.rea.mobile test -f files/rea-engine/scripts/rea.mjs
            adb shell run-as tools.rea.mobile test -x files/usr/bin/jadx
            adb shell run-as tools.rea.mobile test -x files/usr/bin/apktool
            adb shell run-as tools.rea.mobile test -x files/usr/bin/rizin
            adb shell run-as tools.rea.mobile test -x files/usr/bin/radare2
            adb shell run-as tools.rea.mobile test -x files/usr/bin/gdb
            adb shell run-as tools.rea.mobile test -x files/usr/bin/binwalk
            adb shell run-as tools.rea.mobile test -x files/usr/bin/apksigner
            adb shell run-as tools.rea.mobile test -x files/usr/bin/aapt2
            adb shell run-as tools.rea.mobile test -x files/usr/bin/adb
            adb shell run-as tools.rea.mobile test -x files/usr/bin/python
