name: Format repository sources

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/format-repository.yml"

permissions:
  contents: write

concurrency:
  group: format-repository-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply repository formatter
        run: npm run format
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "All tracked files already satisfy the formatter."
            exit 0
          fi
          git add -u
          git commit -m "style: apply repository formatter"
          git push
