name: Real Termux browser verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build app-private Android toolchain"]
    types: [completed]

concurrency:
  group: real-termux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  HUSKY: "0"
  # Writes only on the default branch for push, schedule, manual dispatch,
  # and workflow_call. Pull requests get an empty token and remote read-only mode.
  TURBO_TOKEN: "${{ (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')) && secrets.TURBO_TOKEN || '' }}"
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_CACHE: "${{ (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')) && 'local:rw,remote:rw' || 'local:rw,remote:r' }}"

jobs:
  real-termux:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the pinned Termux app and verify its release checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rea-termux"
          cd "$RUNNER_TEMP/rea-termux"
          release=https://github.com/termux/termux-app/releases/download/v0.118.3
          apk=termux-app_v0.118.3+github-debug_x86_64.apk
          sums=termux-app_v0.118.3+github-debug_sha256sums
          curl --fail --location --retry 3 --output "$apk" "$release/$apk"
          curl --fail --location --retry 3 --output "$sums" "$release/$sums"
          awk -v apk="$apk" '$2 == apk || $2 == "*" apk' "$sums" > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check selected.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and capture a page inside Termux
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          disable-animations: true
          script: bash scripts/verify/termux/emulator.sh
      - name: Upload Termux and Android diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termux-browser-diagnostics
          path: ${{ runner.temp }}/rea-termux/diagnostics
          if-no-files-found: warn

      - name: Download app-private Node runtime candidate
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rea-android-runtime-arm64-candidate
          path: ${{ runner.temp }}/rea-termux/node-runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Assemble complete Android engine assets
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        run: |
          mkdir -p "${{ runner.temp }}/rea-termux/android-assets"
          cp "${{ runner.temp }}/rea-termux/node-runtime/rea-runtime-arm64.tar.gz" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/node-runtime/rea-runtime-arm64.sha256" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/node-runtime/toolchain-manifest.json" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/node-runtime/rea-tools-packages.txt" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/node-runtime/rea-tools-deb-checksums.txt" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/node-runtime/termux-exec-libraries.txt" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/node-runtime/termux-builder-image.txt" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/engine-artifact/rea-engine-js.tar.gz" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/engine-artifact/rea-engine-js.sha256" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/engine-artifact/android-engine-manifest.json" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/engine-artifact/native-addons.txt" "${{ runner.temp }}/rea-termux/android-assets/"
          cp "${{ runner.temp }}/rea-termux/engine-artifact/native-addons-excluded.txt" "${{ runner.temp }}/rea-termux/android-assets/"
          (cd "${{ runner.temp }}/rea-termux/android-assets" && sha256sum --check rea-runtime-arm64.sha256 && sha256sum --check rea-engine-js.sha256)

      - name: Upload combined Android engine assets
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-android-engine-assets
          path: ${{ runner.temp }}/rea-termux/android-assets
          if-no-files-found: error
          retention-days: 14

      - name: Upload REA JavaScript engine bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-engine-js-candidate
          path: |
            ${{ runner.temp }}/rea-termux/engine-artifact/rea-engine-js.tar.gz
            ${{ runner.temp }}/rea-termux/engine-artifact/rea-engine-js.sha256
            ${{ runner.temp }}/rea-termux/engine-artifact/android-engine-manifest.json
            ${{ runner.temp }}/rea-termux/engine-artifact/native-addons.txt
            ${{ runner.temp }}/rea-termux/engine-artifact/native-addons-excluded.txt
          if-no-files-found: error
          retention-days: 14
