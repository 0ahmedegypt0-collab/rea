plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.rearuntime'
version = '0.1.0'

android {
  namespace "expo.modules.rearuntime"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "org.apache.commons:commons-compress:1.27.1"
}
